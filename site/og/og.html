<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Schibsted Grotesk"; src: url(../public/fonts/schibsted-grotesk.woff2) format("woff2"); font-weight: 400 900; }
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; }
body { background: #FBFBFA; color: #1D1D20; font-family: "Schibsted Grotesk", sans-serif; position: relative; }
html, body { width: 1200px; height: 630px; }
body { padding: 60px 72px; }
body::before { content: ""; position: absolute; inset: -260px -200px auto auto; width: 760px; height: 760px; background: radial-gradient(closest-side, rgba(228,169,90,.13), transparent); }
.top { display: flex; align-items: center; justify-content: space-between; position: relative; }
.brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 42px; letter-spacing: -.035em; line-height: 1; }
.brand .bird { width: 78px; height: 62px; }
.brand small { display: block; font-size: 16px; font-weight: 500; letter-spacing: 0; color: #9B9BA3; margin-top: 6px; }
.url { font-size: 22px; color: #9B9BA3; }
h1 { position: relative; margin: 38px 0 0; font-size: 84px; line-height: 1; white-space: nowrap; letter-spacing: -.045em; font-weight: 700; }
h1 span { display: block; }
h1 span + span { color: #9B9BA3; }
.race { position: absolute; left: 72px; right: 72px; bottom: 48px; background: #fff; border: 1.5px solid #E9E9E6; border-radius: 22px; padding: 20px 30px 24px; }
.race p { margin: 0 0 14px; font-size: 17px; color: #9B9BA3; }
.lane { display: grid; grid-template-columns: 130px 1fr 110px; gap: 20px; align-items: center; height: 36px; }
.who { font-size: 20px; color: #5F5F67; }
.us .who { color: #1D1D20; font-weight: 600; }
.track { position: relative; height: 24px; border-radius: 999px; background: #F4F4F2; }
.ball { position: absolute; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #DCDCE0; left: calc((100% - 24px) * var(--p) + 3px); }
.us .ball { background: #E4A95A; box-shadow: 0 0 0 5px rgba(228,169,90,.2); }
.us .ball::before { content: ""; position: absolute; left: 5px; top: 6px; width: 2.6px; height: 2.6px; border-radius: 50%; background: #26262B; box-shadow: 5.4px 0 0 #26262B; }
.us .ball::after { content: ""; position: absolute; left: 6.5px; top: 9.6px; width: 4.6px; height: 2.4px; border: 1.3px solid #26262B; border-top: 0; border-radius: 0 0 4px 4px; }
.val { text-align: right; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.lane:not(.us) .val { color: #5F5F67; font-weight: 500; }
</style></head><body>
<!-- The social card (og.png, 1200×630): the hero's race, held still. After editing, regenerate:
     chrome --headless --window-size=1200,630 --screenshot=public/og.png og/og.html -->
<div class="top"><div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" class="bird">
  <!-- Tov: a hummingbird, small and very fast -->
  <style>
    @media (prefers-color-scheme: dark) { .lines { stroke: #A8AECB; } }
  </style>
  <defs>
    <filter id="r" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <g filter="url(#r)" stroke-linecap="round" stroke-linejoin="round">
    <!-- speed lines -->
    <path class="lines" d="M6 50h12M2 62h14M10 74h8" fill="none" stroke="#26262B" stroke-width="4" opacity=".8"/>
    <!-- tail, fanned -->
    <path d="M40 68 L22 74 Q24 79 30 78 L26 84 Q31 87 35 83 L46 72 Z" fill="#E4A95A" stroke="#26262B" stroke-width="3"/>
    <!-- wing beats: the blur behind the wing -->
    <path d="M58 40 Q44 20 48 6" fill="none" stroke="#26262B" stroke-width="2.4" opacity=".22"/>
    <path d="M60 41 Q54 22 62 8" fill="none" stroke="#26262B" stroke-width="2.4" opacity=".22"/>
    <!-- body and head, one shape -->
    <path d="M97 40 C97 27 89 21 79 21 C69 21 63 27 61 35 C53 42 42 52 37 63 C35 70 39 74 47 72 C62 70 80 63 93 50 C96 47 97 44 97 40 Z" fill="#E4A95A" stroke="#26262B" stroke-width="3.4"/>
    <!-- belly -->
    <path d="M48 69 C62 67 78 60 89 50" fill="none" stroke="#F4D6A2" stroke-width="5"/>
    <!-- wing, swept back -->
    <path d="M66 39 C54 35 40 26 33 12 C39 11 44 14 47 17 C46 11 47 7 50 5 C56 10 60 18 62 24 C64 20 67 18 70 18 C71 26 70 32 68 37 Z" fill="#FFF3DC" stroke="#26262B" stroke-width="3.1"/>
    <path d="M47 18 C52 25 57 30 64 34 M62 25 C63 29 64 32 66 35" fill="none" stroke="#26262B" stroke-width="1.8" opacity=".35"/>
    <!-- beak -->
    <path d="M96 36 L118 30" fill="none" stroke="#26262B" stroke-width="3.6"/>
    <!-- face -->
    <circle cx="84" cy="35" r="4.6" fill="#26262B"/>
    <circle cx="85.7" cy="33.4" r="1.5" fill="#fff"/>
    <ellipse cx="81" cy="45" rx="5" ry="2.8" fill="#F08F8A" opacity=".7"/>
  </g>
</svg>
<div>tov<small>v0.1.0 experimental</small></div></div><div class="url">tov.sh</div></div>
<h1><span>Faster than Rust.</span><span>Written like TypeScript.</span></h1>
<div class="race">
<p>Requests a second, a JSON API on one core</p>
<div class="lane us" style="--p:1"><span class="who">Tov</span><span class="track"><span class="ball"></span></span><span class="val">242k/s</span></div>
<div class="lane" style="--p:.896"><span class="who">Rust</span><span class="track"><span class="ball"></span></span><span class="val">216k/s</span></div>
<div class="lane" style="--p:.458"><span class="who">Bun</span><span class="track"><span class="ball"></span></span><span class="val">111k/s</span></div>
</div>
</body></html>
